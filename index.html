<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jutaの運動タイマー</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* iPhoneでの不要なスクロールを防止 */
    }
    body {
      background-color: #1a1b26;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh; /* iPhoneのDynamic Viewport Heightに対応 */
      padding: 12px;
    }
    .timer-card {
      background-color: #24283b;
      border-radius: 20px;
      padding: 16px;
      width: 100%;
      max-width: 380px;
      max-height: 96dvh; /* 画面内に収める上限を設定 */
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .media-container {
      position: relative;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #38bdf8;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    .media-container video,
    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* Beeのサブ表示エリア */
    .bee-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 14px;
      border-radius: 24px;
      width: 100%;
      justify-content: center;
    }
    .bee-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: contain;
      transition: transform 0.2s;
    }
    .bee-avatar.flip-right {
      transform: scaleX(-1);
    }
    .bee-speech {
      font-size: 13px;
      font-weight: bold;
      color: #e0af68;
    }

    .status-badge {
      background-color: #3b4261;
      padding: 4px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: bold;
    }
    .sets-info {
      font-size: 14px;
      color: #a9b1d6;
    }
    .timer-display {
      font-size: 48px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      width: 100%;
      background-color: #1f2335;
      padding: 10px;
      border-radius: 14px;
    }
    .setting-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .setting-item label {
      font-size: 10px;
      color: #787c99;
    }
    .setting-item select {
      background-color: #292e42;
      color: #fff;
      border: 1px solid #414868;
      padding: 5px 4px;
      border-radius: 6px;
      font-size: 12px;
      width: 100%;
      text-align: center;
      outline: none;
    }
    .button-group {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-start {
      background-color: #38bdf8;
      color: #0f172a;
    }
    .btn-start:hover {
      background-color: #7dd3fc;
    }
    .btn-reset {
      background-color: #f43f5e;
      color: #ffffff;
    }
    .btn-reset:hover {
      background-color: #fb7185;
    }

    /* 画面サイズが小さいiPhone SE等への調整 */
    @media (max-height: 670px) {
      .media-container { width: 140px; height: 140px; }
      .timer-display { font-size: 40px; }
      .bee-avatar { width: 38px; height: 38px; }
      .btn { padding: 10px; font-size: 14px; }
    }
  </style>
</head>
<body>

  <div class="timer-card">
    <!-- Juta メイン映像表示 -->
    <div class="media-container">
      <video id="jutaVideo" loop muted playsinline style="display: none;" src="juta_work1.mp4"></video>
      <img id="jutaImg" src="juta_sleep.png" alt="Juta">
    </div>

    <!-- ステータス & カウントダウン -->
    <div class="status-badge" id="statusBadge">すやすや…</div>
    <div class="sets-info" id="setsInfo">1/3 セット</div>
    <div class="timer-display" id="timeDisplay">00:30</div>

    <!-- Bee キャラクター＆ナビゲート枠 -->
    <div class="bee-container">
      <img id="beeImg" class="bee-avatar flip-right" src="bee_welcome_push.png" alt="Bee">
      <div id="messageText" class="bee-speech">「時間を選んでスタートを押してね！」</div>
    </div>

    <!-- タイマー設定 -->
    <div class="settings-grid">
      <div class="setting-item">
        <label>運動時間</label>
        <select id="workTimeSelect">
          <option value="30">30秒（ちょこ）</option>
          <option value="45">45秒</option>
          <option value="60">1分</option>
          <option value="180">3分</option>
        </select>
      </div>
      <div class="setting-item">
        <label>休憩時間</label>
        <select id="restTimeSelect">
          <option value="15">15秒</option>
          <option value="30">30秒</option>
          <option value="60">1分</option>
        </select>
      </div>
      <div class="setting-item">
        <label>セット数</label>
        <select id="setCountSelect">
          <option value="1">1セット</option>
          <option value="3" selected>3セット</option>
          <option value="5">5セット</option>
        </select>
      </div>
    </div>

    <!-- 操作ボタン -->
    <div class="button-group">
      <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">運動スタート</button>
      <button class="btn btn-reset" onclick="resetTimer()">リセット</button>
    </div>
  </div>

  <!-- BGM & 環境音要素 -->
  <audio id="bgmAudio" loop></audio>
  <audio id="restAudio" src="birds_ambient.mp3" loop></audio>

  <script>
    let timerId = null;
    let isRunning = false;
    let currentPhase = 'idle'; // idle, work, rest, finished
    let currentSet = 1;
    let totalSets = 3;
    let initialWorkTime = 30;
    let timeLeft = 30;

    const jutaVideo = document.getElementById('jutaVideo');
    const jutaImg = document.getElementById('jutaImg');
    const beeImg = document.getElementById('beeImg');
    const statusBadge = document.getElementById('statusBadge');
    const setsInfo = document.getElementById('setsInfo');
    const timeDisplay = document.getElementById('timeDisplay');
    const messageText = document.getElementById('messageText');
    const startBtn = document.getElementById('startBtn');
    const bgmAudio = document.getElementById('bgmAudio');
    const restAudio = document.getElementById('restAudio');

    // 運動中のランダムセリフ候補
    const workRandomSpeech = [
      'juta_breath_kitsui.mp3',
      'juta_rest4.mp3',
      'juta_breath_a-tukareta.mp3',
      'juta_breath_kyukeishitai.mp3',
      'juta_breath_moudame.mp3',
      'juta_breath_tukareta.mp3',
      'juta_keepitup.mp3'
    ];

    // 休憩中のランダムボイス候補
    const restRandomVoices = [
      'juta_rest_konjotte.mp3',
      'juta_rest_motukareta.mp3',
      'juta_rest_kitsui.mp3',
      'juta_rest_kyuukeimijikai.mp3'
    ];

    // 安全な音声再生関数
    function safePlayAudio(filename, volume = 1.0) {
      if (!filename) return;
      try {
        const audio = new Audio(filename);
        audio.volume = volume;
        const promise = audio.play();
        if (promise !== undefined) {
          promise.catch(err => console.log("Audio blocked/missing:", filename));
        }
      } catch (e) {
        console.log("Audio error:", e);
      }
    }

    // カウントダウン表示整形
    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // 画面初期表示・設定同期
    function initDisplay() {
      totalSets = parseInt(document.getElementById('setCountSelect').value);
      initialWorkTime = parseInt(document.getElementById('workTimeSelect').value);
      timeLeft = initialWorkTime;
      setsInfo.textContent = `1/${totalSets} セット`;
      timeDisplay.textContent = formatTime(timeLeft);
    }
    document.getElementById('workTimeSelect').addEventListener('change', initDisplay);
    document.getElementById('setCountSelect').addEventListener('change', initDisplay);
    initDisplay();

    // タイマー開始/一時停止
    function toggleTimer() {
      if (!isRunning) {
        startTimer();
      } else {
        pauseTimer();
      }
    }

    function startTimer() {
      isRunning = true;
      startBtn.textContent = '一時停止';

      if (currentPhase === 'idle') {
        currentSet = 1;
        startWorkPhase();
      } else if (currentPhase === 'work') {
        jutaVideo.play().catch(e => console.log(e));
        try {
          bgmAudio.volume = 0.25;
          bgmAudio.play().catch(e => console.log(e));
        } catch(e) {}
      } else if (currentPhase === 'rest') {
        try {
          restAudio.volume = 0.4;
          restAudio.play().catch(e => console.log(e));
        } catch(e) {}
      }

      if (timerId) clearInterval(timerId);
      timerId = setInterval(tick, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      startBtn.textContent = '再開';
      clearInterval(timerId);
      jutaVideo.pause();
      bgmAudio.pause();
      restAudio.pause();
    }

    function resetTimer() {
      clearInterval(timerId);
      isRunning = false;
      currentPhase = 'idle';
      startBtn.textContent = '運動スタート';

      jutaVideo.pause();
      jutaVideo.style.display = 'none';
      jutaImg.style.display = 'block';
      jutaImg.src = 'juta_sleep.png';

      beeImg.src = 'bee_welcome_push.png';
      beeImg.classList.add('flip-right');
      messageText.textContent = '「時間を選んでスタートを押してね！」';
      statusBadge.textContent = 'すやすや…';

      bgmAudio.pause();
      bgmAudio.currentTime = 0;
      restAudio.pause();
      restAudio.currentTime = 0;

      initDisplay();
    }

    // 1秒ごとの処理
    function tick() {
      if (timeLeft > 0) {
        timeLeft--;
        timeDisplay.textContent = formatTime(timeLeft);

        // 運動中（work）の演出
        if (currentPhase === 'work') {
          const halfTime = Math.floor(initialWorkTime / 2);
          const quarterTime = Math.floor(initialWorkTime / 4);
          const isOdd = (currentSet % 2 !== 0);
          const breathVoice = isOdd ? 'juta_breath_fufu_1st.mp3' : 'juta_breath_fufu_2nd.mp3';

          // 残り3秒でBeeのカウントダウン（3, 2, 1）
          if (timeLeft === 3) {
            safePlayAudio('bee_cnt.wav');
          }
          // 残り半分になった時 ➔ 「あと半分〜」固定
          else if (timeLeft === halfTime) {
            safePlayAudio('juta_breath_atohannbun.mp3');
          }
          // 次のセットがある場合のみ、残り1/4の時点 ➔ 「休憩まであとどれくらい？」
          else if (timeLeft === quarterTime && currentSet < totalSets && quarterTime > 3) {
            safePlayAudio('juta_breath_kyukemadeatodorekurai.mp3');
          }
          // 5秒おきに「息ボイス」と「ランダムセリフ」を交互に挿入
          else if (timeLeft > 3 && timeLeft % 5 === 0) {
            if (timeLeft % 10 === 0) {
              safePlayAudio(breathVoice, 0.8);
            } else {
              const randomSpeech = workRandomSpeech[Math.floor(Math.random() * workRandomSpeech.length)];
              safePlayAudio(randomSpeech);
            }
          }
        }
        // 休憩中（rest）の演出
        else if (currentPhase === 'rest') {
          // 休憩終わりの3秒前にもBeeのカウントダウン（3, 2, 1）
          if (timeLeft === 3) {
            safePlayAudio('bee_cnt.wav');
          }
        }
      } else {
        // フェーズ切替
        if (currentPhase === 'work') {
          if (currentSet < totalSets) {
            startRestPhase();
          } else {
            finishWorkout();
          }
        } else if (currentPhase === 'rest') {
          currentSet++;
          startWorkPhase();
        }
      }
    }

    // 運動フェーズ開始
    function startWorkPhase() {
      currentPhase = 'work';
      initialWorkTime = parseInt(document.getElementById('workTimeSelect').value);
      timeLeft = initialWorkTime;
      timeDisplay.textContent = formatTime(timeLeft);
      setsInfo.textContent = `${currentSet}/${totalSets} セット`;
      statusBadge.textContent = '運動中！';

      const isOdd = (currentSet % 2 !== 0);
      const bgmTarget = isOdd ? 'juta_bgm_sample1_180sec.wav' : 'juta_bgm_sample2_180sec.wav';
      if (bgmAudio.getAttribute('src') !== bgmTarget) {
        bgmAudio.src = bgmTarget;
      }

      restAudio.pause();
      restAudio.currentTime = 0;
      try {
        bgmAudio.volume = 0.25;
        bgmAudio.play().catch(e => console.log(e));
      } catch(e) {}

      const targetVideo = isOdd ? 'juta_work1.mp4' : 'juta_work2.mp4';
      if (jutaVideo.getAttribute('src') !== targetVideo) {
        jutaVideo.src = targetVideo;
      }

      jutaImg.style.display = 'none';
      jutaVideo.style.display = 'block';
      jutaVideo.currentTime = 0;
      jutaVideo.play().catch(e => console.log(e));

      beeImg.src = 'bee_cheer.png';
      beeImg.classList.remove('flip-right');
      messageText.textContent = '「がんばれがんばれー！」';

      // 【スタート掛け合い】
      const startVoice = (currentSet === 1) ? 'juta_start1.mp3' : 'juta_start2.mp3';
      safePlayAudio(startVoice);

      setTimeout(() => { safePlayAudio('bee_cheer.mp3'); }, 1600);

      setTimeout(() => {
        const breathVoice = isOdd ? 'juta_breath_fufu_1st.mp3' : 'juta_breath_fufu_2nd.mp3';
        safePlayAudio(breathVoice, 0.8);
      }, 4800);
    }

    // 休憩フェーズ開始
    function startRestPhase() {
      currentPhase = 'rest';
      timeLeft = parseInt(document.getElementById('restTimeSelect').value);
      timeDisplay.textContent = formatTime(timeLeft);
      statusBadge.textContent = '休憩中…';

      bgmAudio.pause();
      try {
        restAudio.volume = 0.4;
        restAudio.play().catch(e => console.log(e));
      } catch(e) {}

      jutaVideo.pause();
      jutaVideo.style.display = 'none';
      jutaImg.style.display = 'block';
      jutaImg.src = 'juta_rest.png';

      beeImg.src = 'bee_rest.png';
      beeImg.classList.add('flip-right');
      messageText.textContent = '「ふぅ〜しっかり息を整えてね！」';

      // Juta「休憩〜」（juta_rest1 または juta_rest2）
      const headRestVoice = (Math.random() < 0.5) ? 'juta_rest1.mp3' : 'juta_rest2.mp3';
      safePlayAudio(headRestVoice);

      setTimeout(() => { safePlayAudio('bee_rest.mp3'); }, 2000);

      setTimeout(() => {
        const randomRestVoice = restRandomVoices[Math.floor(Math.random() * restRandomVoices.length)];
        safePlayAudio(randomRestVoice);
      }, 5500);
    }

    // 全セット終了
    function finishWorkout() {
      clearInterval(timerId);
      isRunning = false;
      currentPhase = 'finished';
      statusBadge.textContent = '完了！';
      startBtn.textContent = '運動スタート';

      jutaVideo.pause();
      jutaVideo.style.display = 'none';
      jutaImg.style.display = 'block';
      jutaImg.src = 'juta_finish.png';

      beeImg.src = 'bee_finish.png';
      beeImg.classList.add('flip-right');
      messageText.textContent = '「やったね！今日もお疲れ様でした！」';

      bgmAudio.pause();
      restAudio.pause();

      safePlayAudio('juta_end_syuuryo_yokuyatta.mp3');
      setTimeout(() => { safePlayAudio('bee_finish.mp3'); }, 3200);
      setTimeout(() => { safePlayAudio('juta_end_ehhen.mp3'); }, 6500);
    }
  </script>
</body>
</html>
