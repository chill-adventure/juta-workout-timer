<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jutaの運動タイマー</title>
  <style>
    body {
      margin: 0;
      background-color: #1a1a24;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #2a2a38;
      border-radius: 16px;
      padding: 20px;
      width: 85%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    /* メディア表示枠 */
    .media-box {
      width: 200px;
      height: 200px;
      margin: 0 auto 10px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #4fc3f7;
      background: #000;
    }
    .media-box img, .media-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 6px;
      background: #555;
    }
    .status-work { background: #ff5555; color: #fff; }
    .status-rest { background: #50fa7b; color: #1a1a24; }

    .set-count {
      font-size: 0.95rem;
      color: #aaa;
      margin-bottom: 2px;
    }
    .timer-display {
      font-size: 2.5rem;
      font-weight: bold;
      color: #4fc3f7;
      margin: 2px 0 8px;
    }
    .message {
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 15px;
      min-height: 40px;
    }
    
    /* 設定選択エリア */
    .setting-group {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 15px;
      background: #20202c;
      padding: 10px;
      border-radius: 10px;
    }
    .setting-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      color: #ccc;
      flex: 1;
    }
    .setting-item select {
      margin-top: 4px;
      padding: 4px;
      border-radius: 6px;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      font-size: 12px;
      width: 100%;
      text-align: center;
    }

    .btn-group button {
      background: #4fc3f7;
      color: #1a1a24;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin: 4px;
    }
    .btn-group button.stop-btn {
      background: #ff79c6;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Juta表示エリア（画像／動画切替） -->
    <div class="media-box">
      <img id="jutaImg" src="juta_sleep.png" alt="Juta">
      <video id="jutaVideo" src="juta_work1.mp4" playsinline loop style="display: none;"></video>
    </div>

    <!-- 状態表示 -->
    <div id="statusBadge" class="status-badge">すやすや…</div>
    <div id="setCount" class="set-count">1 / 1 セット</div>
    <div class="timer-display" id="timerDisplay">00:30</div>

    <!-- メッセージ -->
    <div class="message" id="msg">「時間を選んでスタートを押してね！」</div>

    <!-- 設定選択エリア -->
    <div class="setting-group" id="settingArea">
      <div class="setting-item">
        <label for="workSelect">運動時間</label>
        <select id="workSelect">
          <option value="30">30秒（ちょこっと）</option>
          <option value="60">1分（標準）</option>
          <option value="180">3分（じっくり）</option>
        </select>
      </div>

      <div class="setting-item">
        <label for="restSelect">休憩時間</label>
        <select id="restSelect">
          <option value="15">15秒</option>
          <option value="30">30秒</option>
          <option value="60">1分</option>
        </select>
      </div>

      <div class="setting-item">
        <label for="setSelect">セット数</label>
        <select id="setSelect">
          <option value="1">1セット</option>
          <option value="3" selected>3セット</option>
          <option value="5">5セット</option>
        </select>
      </div>
    </div>

    <!-- 操作ボタン -->
    <div class="btn-group">
      <button type="button" onclick="startWorkout()">運動スタート</button>
      <button type="button" class="stop-btn" onclick="resetTimer()">リセット</button>
    </div>

    <audio id="jutaVoice"></audio>
  </div>

<script>
  let timerId = null;
  let mode = 'IDLE'; // IDLE, WORK, REST
  let timeLeft = 0;
  
  let currentSet = 1;
  let totalSets = 3;
  let workDuration = 30;
  let restDuration = 15;

  function startWorkout() {
    resetTimer();

    // ユーザー選択値の取得
    workDuration = parseInt(document.getElementById('workSelect').value);
    restDuration = parseInt(document.getElementById('restSelect').value);
    totalSets = parseInt(document.getElementById('setSelect').value);

    // iOS動画アンロック（ボタン押下時にロード）
    const video = document.getElementById('jutaVideo');
    if (video) video.load();

    currentSet = 1;
    switchMode('WORK');

    timerId = setInterval(() => {
      timeLeft--;
      updateDisplay();

      // 折り返し地点（中間地点）で応援ボイス再生
      const halfTime = Math.floor(workDuration / 2);
      if (mode === 'WORK' && timeLeft === halfTime) {
        playVoice("juta_keepitup.mp3");
      }

      if (timeLeft <= 0) {
        if (mode === 'WORK') {
          // 運動終了 ➔ 最終セットなら完了、それ以外は休憩へ
          if (currentSet >= totalSets) {
            resetTimerKeepFinish();
            onFinished();
          } else {
            switchMode('REST');
          }
        } else if (mode === 'REST') {
          // 休憩終了 ➔ 次のセットの運動へ
          currentSet++;
          switchMode('WORK');
        }
      }
    }, 1000);
  }

  function switchMode(newMode) {
    mode = newMode;
    const badge = document.getElementById('statusBadge');
    const msgArea = document.getElementById('msg');
    const img = document.getElementById('jutaImg');
    const video = document.getElementById('jutaVideo');

    document.getElementById('setCount').innerText = `${currentSet} / ${totalSets} セット`;

    if (mode === 'WORK') {
      timeLeft = workDuration;
      badge.innerText = "🔥 運動中！";
      badge.className = "status-badge status-work";
      if (msgArea) msgArea.innerText = "「がんばれがんばれー！」";
      
      // セット数に応じて動画（juta_work1 / juta_work2）を交互に切り替え
      const videoSrc = (currentSet % 2 === 1) ? "juta_work1.mp4" : "juta_work2.mp4";
      video.src = videoSrc;

      // 動画表示＋再生、画像を隠す
      img.style.display = 'none';
      video.style.display = 'block';
      video.play().catch(e => console.log("動画再生エラー:", e));

      playVoice("juta_start.mp3");

    } else if (mode === 'REST') {
      timeLeft = restDuration;
      badge.innerText = "☕ 休憩中";
      badge.className = "status-badge status-rest";
      if (msgArea) msgArea.innerText = "「ふぅ〜しっかり息を整えてね！」";

      // 画像表示（へばるJuta）、動画を停止して隠す
      video.pause();
      video.style.display = 'none';
      img.style.display = 'block';
      img.src = "juta_rest.png";

      playVoice("juta_rest.mp3");
    }
    updateDisplay();
  }

  function updateDisplay() {
    const mins = Math.floor(timeLeft / 60);
    const secs = timeLeft % 60;
    document.getElementById('timerDisplay').innerText = 
      String(mins).padStart(2, '0') + ":" + String(secs).padStart(2, '0');
  }

  function resetTimer() {
    if (timerId !== null) {
      clearInterval(timerId);
      timerId = null;
    }
    mode = 'IDLE';
    
    const video = document.getElementById('jutaVideo');
    const img = document.getElementById('jutaImg');
    const badge = document.getElementById('statusBadge');
    const msgArea = document.getElementById('msg');

    if (video) {
      video.pause();
      video.style.display = 'none';
    }
    if (img) {
      img.style.display = 'block';
      img.src = "juta_sleep.png";
    }

    if (badge) {
      badge.innerText = "すやすや…";
      badge.className = "status-badge";
    }
    if (msgArea) msgArea.innerText = "「時間を選んでスタートを押してね！」";

    document.getElementById('setCount').innerText = "1 / 1 セット";
    document.getElementById('timerDisplay').innerText = "00:30";
  }

  function resetTimerKeepFinish() {
    if (timerId !== null) {
      clearInterval(timerId);
      timerId = null;
    }
    mode = 'IDLE';
  }

  function onFinished() {
    const video = document.getElementById('jutaVideo');
    const img = document.getElementById('jutaImg');
    const badge = document.getElementById('statusBadge');
    const msgArea = document.getElementById('msg');

    if (video) {
      video.pause();
      video.style.display = 'none';
    }
    if (img) {
      img.style.display = 'block';
      img.src = "juta_finish.png";
    }

    if (badge) {
      badge.innerText = "🎉 全セット完了！";
      badge.className = "status-badge";
    }
    if (msgArea) msgArea.innerText = "「やったね！今日もお疲れ様でした！」";

    playVoice("juta_finish.mp3");
  }

  function playVoice(src) {
    const audio = document.getElementById('jutaVoice');
    if (audio) {
      audio.src = src;
      audio.currentTime = 0;
      audio.play().catch(e => console.log("音声再生エラー:", e));
    }
  }
// juta_work1 や juta_work2 のループ時のラグ（コマ飛び）を消す処理
// 運動動画のシームレス（完全繋ぎ目なし）ループ制御
const video = document.getElementById('jutaVideo');
if (video) {
  // 標準のloop属性によるラグを防ぐため、JS側で終端手前制御
  video.removeAttribute('loop');

  video.addEventListener('timeupdate', function() {
    // 動画の終了直前（残り0.08秒手前）で先頭にジャンプして再生を維持
    if (this.duration && this.currentTime >= this.duration - 0.08) {
      this.currentTime = 0;
      this.play().catch(e => console.log("Loop play error:", e));
    }
  });
}

</script>

</body>
</html>
