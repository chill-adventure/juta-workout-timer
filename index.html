<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jutaの運動タイマー</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1b26;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .timer-card {
      background-color: #24283b;
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .media-container {
      position: relative;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #38bdf8;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .media-container video,
    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* Beeのサブ表示エリア */
    .bee-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 16px;
      border-radius: 30px;
      width: 100%;
      justify-content: center;
      cursor: pointer;
    }
    .bee-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: contain;
      transition: transform 0.2s;
    }
    .bee-avatar.flip-right {
      transform: scaleX(-1);
    }
    .bee-speech {
      font-size: 14px;
      font-weight: bold;
      color: #e0af68;
    }

    .status-badge {
      background-color: #3b4261;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }
    .sets-info {
      font-size: 16px;
      color: #a9b1d6;
    }
    .timer-display {
      font-size: 56px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      width: 100%;
      background-color: #1f2335;
      padding: 12px;
      border-radius: 16px;
    }
    .setting-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .setting-item label {
      font-size: 11px;
      color: #787c99;
    }
    .setting-item select {
      background-color: #292e42;
      color: #fff;
      border: 1px solid #414868;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 13px;
      width: 100%;
      text-align: center;
      outline: none;
    }
    .button-group {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 8px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-start {
      background-color: #38bdf8;
      color: #0f172a;
    }
    .btn-start:hover {
      background-color: #7dd3fc;
    }
    .btn-reset {
      background-color: #f43f5e;
      color: #ffffff;
    }
    .btn-reset:hover {
      background-color: #fb7185;
    }
  </style>
</head>
<body>

  <div class="timer-card" id="timerCard">
    <!-- Juta メイン映像表示 -->
    <div class="media-container">
      <video id="jutaVideo" loop muted playsinline style="display: none;" src="juta_work1.mp4"></video>
      <img id="jutaImg" src="juta_sleep.png" alt="Juta">
    </div>

    <!-- ステータス & カウントダウン -->
    <div class="status-badge" id="statusBadge">すやすや…</div>
    <div class="sets-info" id="setsInfo">1/3 セット</div>
    <div class="timer-display" id="timeDisplay">00:30</div>

    <!-- Bee キャラクター＆ナビゲート枠 -->
    <div class="bee-container">
      <img id="beeImg" class="bee-avatar flip-right" src="bee_welcome_push.png" alt="Bee">
      <div id="messageText" class="bee-speech">「時間を選んでスタートを押してね！」</div>
    </div>

    <!-- タイマー設定 -->
    <div class="settings-grid">
      <div class="setting-item">
        <label>運動時間</label>
        <select id="workTimeSelect">
          <option value="30">30秒（ちょこ）</option>
          <option value="60">1分</option>
          <option value="180">3分</option>
        </select>
      </div>
      <div class="setting-item">
        <label>休憩時間</label>
        <select id="restTimeSelect">
          <option value="15">15秒</option>
          <option value="30">30秒</option>
          <option value="60">1分</option>
        </select>
      </div>
      <div class="setting-item">
        <label>セット数</label>
        <select id="setCountSelect">
          <option value="1">1セット</option>
          <option value="3" selected>3セット</option>
          <option value="5">5セット</option>
        </select>
      </div>
    </div>

    <!-- 操作ボタン -->
    <div class="button-group">
      <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">運動スタート</button>
      <button class="btn btn-reset" onclick="resetTimer()">リセット</button>
    </div>
  </div>

  <!-- BGM要素 -->
  <audio id="bgmAudio" src="juta_bgm_demo.mp3" loop></audio>

  <script>
    let timerId = null;
    let isRunning = false;
    let currentPhase = 'idle'; // idle, work, rest, finished
    let currentSet = 1;
    let totalSets = 3;
    let timeLeft = 30;
    let welcomePlayed = false;

    const jutaVideo = document.getElementById('jutaVideo');
    const jutaImg = document.getElementById('jutaImg');
    const beeImg = document.getElementById('beeImg');
    const statusBadge = document.getElementById('statusBadge');
    const setsInfo = document.getElementById('setsInfo');
    const timeDisplay = document.getElementById('timeDisplay');
    const messageText = document.getElementById('messageText');
    const startBtn = document.getElementById('startBtn');
    const bgmAudio = document.getElementById('bgmAudio');

    // 安全な音声再生関数
    function safePlayAudio(filename, volume = 1.0) {
      if (!filename) return;
      try {
        const audio = new Audio(filename);
        audio.volume = volume;
        const promise = audio.play();
        if (promise !== undefined) {
          promise.catch(err => console.log("Audio blocked:", err));
        }
      } catch (e) {
        console.log("Audio error:", e);
      }
    }

    // 初回画面タッチ/クリック時の処理（スタートボタン以外を押した時だけ案内を流す）
    function handleInitialInteraction(e) {
      if (welcomePlayed || currentPhase !== 'idle') return;

      // クリックされたのがスタートボタンなら、初期案内は鳴らさずにパス
      if (e.target && e.target.id === 'startBtn') {
        welcomePlayed = true;
        return;
      }

      welcomePlayed = true;
      safePlayAudio('bee_welcome_push.mp3', 0.8);
    }

    document.addEventListener('pointerdown', handleInitialInteraction, { once: true });

    // カウントダウン表示整形
    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // 画面初期表示・設定同期
    function initDisplay() {
      totalSets = parseInt(document.getElementById('setCountSelect').value);
      timeLeft = parseInt(document.getElementById('workTimeSelect').value);
      setsInfo.textContent = `1/${totalSets} セット`;
      timeDisplay.textContent = formatTime(timeLeft);
    }
    document.getElementById('workTimeSelect').addEventListener('change', initDisplay);
    document.getElementById('setCountSelect').addEventListener('change', initDisplay);
    initDisplay();

    // タイマー開始/一時停止
    function toggleTimer() {
      welcomePlayed = true; // スタートを押したので初期案内フラグを埋める

      if (!isRunning) {
        startTimer();
      } else {
        pauseTimer();
      }
    }

    function startTimer() {
      isRunning = true;
      startBtn.textContent = '一時停止';
      
      // BGM再生
      try {
        bgmAudio.volume = 0.25;
        bgmAudio.play().catch(e => console.log("BGM play suppressed:", e));
      } catch(e) {}

      if (currentPhase === 'idle') {
        currentSet = 1;
        startWorkPhase();
      } else {
        if (currentPhase === 'work') {
          jutaVideo.play().catch(e => console.log(e));
        }
      }

      if (timerId) clearInterval(timerId);
      timerId = setInterval(tick, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      startBtn.textContent = '再開';
      clearInterval(timerId);
      jutaVideo.pause();
      bgmAudio.pause();
    }

    function resetTimer() {
      clearInterval(timerId);
      isRunning = false;
      currentPhase = 'idle';
      welcomePlayed = false;
      startBtn.textContent = '運動スタート';

      jutaVideo.pause();
      jutaVideo.style.display = 'none';
      jutaImg.style.display = 'block';
      jutaImg.src = 'juta_sleep.png';

      beeImg.src = 'bee_welcome_push.png';
      beeImg.classList.add('flip-right');
      messageText.textContent = '「時間を選んでスタートを押してね！」';
      statusBadge.textContent = 'すやすや…';

      bgmAudio.pause();
      bgmAudio.currentTime = 0;

      initDisplay();
    }

    // 1秒ごとの処理
    function tick() {
      if (timeLeft > 0) {
        timeLeft--;
        timeDisplay.textContent = formatTime(timeLeft);

        // 運動中（work）の掛け声・息づかい演出
        if (currentPhase === 'work') {
          if (timeLeft === 15) {
            safePlayAudio('juta_breath_kitsui.mp3');
          } else if (timeLeft === 5) {
            safePlayAudio('juta_breath_moudame.mp3');
          } else if (timeLeft % 8 === 0 && timeLeft > 0) {
            safePlayAudio('juta_breath_fufu.mp3', 0.6);
          }
        }
      } else {
        // フェーズ切替
        if (currentPhase === 'work') {
          if (currentSet < totalSets) {
            startRestPhase();
          } else {
            finishWorkout();
          }
        } else if (currentPhase === 'rest') {
          currentSet++;
          startWorkPhase();
        }
      }
    }

    // 運動フェーズ開始
    function startWorkPhase() {
      currentPhase = 'work';
      timeLeft = parseInt(document.getElementById('workTimeSelect').value);
      timeDisplay.textContent = formatTime(timeLeft);
      setsInfo.textContent = `${currentSet}/${totalSets} セット`;
      statusBadge.textContent = '運動中！';

      // 奇数セットは走る(juta_work1)、偶数セットは自転車こぎ(juta_work2)
      const targetVideo = (currentSet % 2 !== 0) ? 'juta_work1.mp4' : 'juta_work2.mp4';
      if (jutaVideo.getAttribute('src') !== targetVideo) {
        jutaVideo.src = targetVideo;
      }

      // 表示切り替え
      jutaImg.style.display = 'none';
      jutaVideo.style.display = 'block';
      jutaVideo.currentTime = 0;
      jutaVideo.play().catch(e => console.log("Video play suppressed:", e));

      beeImg.src = 'bee_cheer.png';
      beeImg.classList.remove('flip-right'); // 左向き
      messageText.textContent = '「がんばれがんばれー！」';

      // 順序: Juta「運動スタート」 ➔ Bee「がんばれがんばれー！」
      safePlayAudio('juta_start.mp3');
      setTimeout(() => { safePlayAudio('bee_cheer.mp3'); }, 1500);
    }

    // 休憩フェーズ開始
    function startRestPhase() {
      currentPhase = 'rest';
      timeLeft = parseInt(document.getElementById('restTimeSelect').value);
      timeDisplay.textContent = formatTime(timeLeft);
      statusBadge.textContent = '休憩中…';

      // 表示切り替え
      jutaVideo.pause();
      jutaVideo.style.display = 'none';
      jutaImg.style.display = 'block';
      jutaImg.src = 'juta_rest.png';

      beeImg.src = 'bee_rest.png';
      beeImg.classList.add('flip-right'); // 右向き
      messageText.textContent = '「ふぅ〜しっかり息を整えてね！」';

      // 順序: Juta「休憩」 ➔ Bee「ふぅ〜しっかり息を整えてね！」
      safePlayAudio('juta_rest.mp3');
      setTimeout(() => { safePlayAudio('bee_rest.mp3'); }, 1200);
    }

    // 全セット終了
    function finishWorkout() {
      clearInterval(timerId);
      isRunning = false;
      currentPhase = 'finished';
      statusBadge.textContent = '完了！';
      startBtn.textContent = '運動スタート';

      jutaVideo.pause();
      jutaVideo.style.display = 'none';
      jutaImg.style.display = 'block';
      jutaImg.src = 'juta_finish.png';

      beeImg.src = 'bee_finish.png';
      beeImg.classList.add('flip-right'); // 右向き
      messageText.textContent = '「やったね！今日もお疲れ様でした！」';

      bgmAudio.pause();

      // ★ Bee「やったね！今日もお疲れ様でした！」(長尺) ➔ (3.8秒後) ➔ Juta「お疲れ様でした！」
      safePlayAudio('bee_finish.mp3');
      setTimeout(() => { safePlayAudio('juta_finish.mp3'); }, 3800);
    }
  </script>
</body>
</html>
