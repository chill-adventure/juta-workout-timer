<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jutaの運動タイマー</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1b26;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .timer-card {
      background-color: #24283b;
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .media-container {
      position: relative;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #38bdf8;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .media-container video,
    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* Beeのサブ表示エリア */
    .bee-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 16px;
      border-radius: 30px;
      width: 100%;
      justify-content: center;
    }
    .bee-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: contain;
      transition: transform 0.2s;
    }
    /* Beeを右向きに反転させるクラス */
    .bee-avatar.flip-right {
      transform: scaleX(-1);
    }
    .bee-speech {
      font-size: 14px;
      font-weight: bold;
      color: #e0af68;
    }

    .status-badge {
      background-color: #3b4261;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }
    .sets-info {
      font-size: 16px;
      color: #a9b1d6;
    }
    .timer-display {
      font-size: 56px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      width: 100%;
      background-color: #1f2335;
      padding: 12px;
      border-radius: 16px;
    }
    .setting-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .setting-item label {
      font-size: 11px;
      color: #787c99;
    }
    .setting-item select {
      background-color: #292e42;
      color: #fff;
      border: 1px solid #414868;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 13px;
      width: 100%;
      text-align: center;
      outline: none;
    }
    .button-group {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 8px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-start {
      background-color: #38bdf8;
      color: #0f172a;
    }
    .btn-start:hover {
      background-color: #7dd3fc;
    }
    .btn-reset {
      background-color: #f43f5e;
      color: #ffffff;
    }
    .btn-reset:hover {
      background-color: #fb7185;
    }
  </style>
</head>
<body>

  <div class="timer-card">
    <!-- Juta メイン映像表示 -->
    <div class="media-container">
