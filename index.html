<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jutaの運動タイマー</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1b26;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .timer-card {
      background-color: #24283b;
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .media-container {
      position: relative;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #38bdf8;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .media-container video,
    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* Beeのサブ表示エリア */
    .bee-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 16px;
      border-radius: 30px;
      width: 100%;
      justify-content: center;
    }
    .bee-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: contain;
      transition: transform 0.2s;
    }
    .bee-avatar.flip-right {
      transform: scaleX(-1);
    }
    .bee-speech {
      font-size: 14px;
      font-weight: bold;
      color: #e0af68;
    }

    .status-badge {
      background-color: #3b4261;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }
    .sets-info {
      font-size: 16px;
      color: #a9b1d6;
    }
    .timer-display {
      font-size: 56px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      width: 100%;
      background-color: #1f2335;
      padding: 12px;
      border-radius: 16px;
    }
    .setting-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .setting-item label {
      font-size: 11px;
      color: #787c99;
    }
    .setting-item select {
      background-color: #292e42;
      color: #fff;
      border: 1px solid #414868;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 13px;
      width: 100%;
      text-align: center;
      outline: none;
    }
    .button-group {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 8px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-start {
      background-color: #38bdf8;
      color: #0f172a;
    }
    .btn-start:hover {
      background-color: #7dd3fc;
    }
    .btn-reset {
      background-color: #f43f5e;
      color: #ffffff;
    }
    .btn-reset:hover {
      background-color: #fb7185;
    }
  </style>
</head>
<body>

  <div class="timer-card">
    <!-- Juta メイン映像表示 -->
    <div class="media-container">
      <video id="jutaVideo" loop muted playsinline style="display: none;" src="juta_work1.mp4"></video>
      <img id="jutaImg" src="juta_sleep.png" alt="Juta">
    </div>

    <!-- ステータス & カウントダウン -->
    <div class="status-badge" id="statusBadge">すやすや…</div>
    <div class="sets-info" id="setsInfo">1/3 セット</div>
    <div class="timer-display" id="timeDisplay">00:30</div>

    <!-- Bee キャラクター＆ナビゲート枠 -->
    <div class="bee-container">
      <img id="beeImg" class="bee-avatar flip-right" src="bee_welcome_push.png" alt="Bee">
      <div id="messageText" class="bee-speech">「時間を選んでスタートを押してね！」</div>
    </div>

    <!-- タイマー設定 -->
    <div class="settings-grid">
      <div class="setting-item">
        <label>運動時間</label>
        <select id="workTimeSelect">
          <option value="30">30秒（ちょこ）</option>
          <option value="60">1分</option>
          <option value="180">3分</option>
        </select>
      </div>
      <div class="setting-item">
        <label>休憩時間</label>
        <select id="restTimeSelect">
          <option value="15">15秒</option>
          <option value="30">30秒</option>
          <option value="60">1分</option>
        </select>
      </div>
      <div class="setting-item">
        <label>セット数</label>
        <select id="setCountSelect">
          <option value="1">1セット</option>
          <option value="3" selected>3セット</option>
          <option value="5">5セット</option>
        </select>
      </div>
    </div>

    <!-- 操作ボタン -->
    <div class="button-group">
      <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">運動スタート</button>
      <button class="btn btn-reset" onclick="resetTimer()">リセット</button>
    </div>
  </div>

  <!-- BGM & 環境音要素 -->
  <audio id="bgmAudio" src="juta_bgm_demo.mp3" loop></audio>
  <audio id="restAudio" src="birds_ambient.mp3" loop></audio>

  <script>
    let timerId = null;
    let isRunning = false;
    let currentPhase = 'idle'; // idle, work, rest, finished
    let currentSet = 1;
    let totalSets = 3;
    let initialWorkTime = 30;
    let timeLeft = 30;

    const jutaVideo = document.getElementById('jutaVideo');
    const jutaImg = document.getElementById('jutaImg');
    const beeImg = document.getElementById('beeImg');
    const statusBadge = document.getElementById('statusBadge');
    const setsInfo = document.getElementById('setsInfo');
    const timeDisplay = document.getElementById('timeDisplay');
    const messageText = document.getElementById('messageText');
    const startBtn = document.getElementById('startBtn');
    const bgmAudio = document.getElementById('bgmAudio');
    const restAudio = document.getElementById('restAudio');

    // 運動中のランダムボイス候補
    const workRandomVoices = [
      'juta_breath_kitsui.mp3',
      'juta_rest4.mp3',
      'juta_rest3.mp3',
      'juta_breath_moudame1.mp3',
      'juta_breath_tukareta.mp3',
      'bee_breath_madamada.mp3',
      'juta_keepitup.mp3'
    ];

    // 休憩中のランダムボイス候補
    const restRandomVoices = [
      'juta_breath_konjotte.mp3',
      'juta_breath_motukareta.mp3'
    ];

    // 100%エラーで止まらない安全な音声再生関数
    function safePlayAudio(filename, volume = 1.0) {
      if (!filename) return;
      try {
        const audio = new Audio(filename);
        audio.volume = volume;
        const promise = audio.play();
        if (promise !== undefined) {
          promise.catch(err => console.log("Audio blocked/missing:", filename));
        }
      } catch (e) {
        console.log("Audio error:", e);
      }
    }

    // カウントダウン表示整形
    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // 画面初期表示・設定同期
    function initDisplay() {
      totalSets = parseInt(document.getElementById('setCountSelect').value);
      initialWorkTime = parseInt(document.getElementById('workTimeSelect').value);
